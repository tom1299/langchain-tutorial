[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-tutorial"
version = "0.1.0"
description = "First steps with LangChain"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=1.1.0",
    "beautifulsoup4>=4.14.3",
    "bs4>=0.0.2",
    "gitpython>=3.1.50",
    "langchain>=1.1.3",
    "langchain-anthropic>=1.2.0",
    "langchain-openai>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.0.4",
    "langgraph-checkpoint>=3.0.1",
    "langgraph-checkpoint-postgres>=3.0.3",
    "langgraph-prebuilt>=1.0.5",
    "langgraph-sdk>=0.2.15",
    "numpy>=2.4.6",
    "playwright>=1.57.0",
    "psycopg>=3.3.2",
    "psycopg-binary>=3.3.2",
    "psycopg-pool>=3.3.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pylint>=4.0.4",
    "pypdf>=6.13.2",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "sse-starlette>=3.4.4",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# pytest command line options:
addopts = """
--capture=tee-sys
"""
# pytest.ini options:
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
log_cli = true
log_cli_level = "DEBUG"

[dependency-groups]
dev = []
